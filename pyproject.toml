[project]
name = "wyoming-faster-whisper"
version = "3.9.0"
description = "Wyoming server for Whisper on whisper.cpp with Vulkan GPU support"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Michael Hansen", email = "mike@rhasspy.org"}
]
keywords = ["rhasspy", "wyoming", "whisper", "whisper.cpp", "vulkan", "stt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "wyoming>=1.10.2,<2",
    # The PyPI wheels are CPU-only; Dockerfile.vulkan builds this from source
    # with GGML_VULKAN=1 and installs that wheel first.
    "pywhispercpp>=1.5.1,<2",
    "huggingface-hub>=0.20",
    "numpy",
    "pysilero-vad>=3.4.0,<4",
]

[project.urls]
Homepage = "https://github.com/frauhottelmann/wyoming-faster-whisper"
Upstream = "https://github.com/OHF-Voice/wyoming-faster-whisper"

[tool.setuptools]
platforms = ["any"]
zip-safe  = true
include-package-data = true

[tool.setuptools.packages.find]
include = ["wyoming_faster_whisper"]
exclude = ["tests"]

[project.scripts]
wyoming-faster-whisper = "wyoming_faster_whisper.__main__:run"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "isort",
    "mypy",
    "pylint",
    "pytest",
    "pytest-asyncio",
]
hass = [
    "aiohttp>=3.8,<4",
]
zeroconf = [
    "wyoming[zeroconf]",
]

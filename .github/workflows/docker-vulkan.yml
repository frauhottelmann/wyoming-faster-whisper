---
# Builds Dockerfile.vulkan, checks that it transcribes through whisper.cpp's
# Vulkan backend, and publishes it to the GitHub Container Registry:
#
#   pull request   build + smoke test, nothing pushed
#   push to main   ghcr.io/frauhottelmann/wyoming-vulkan-whisper:main (+ sha-<commit>)
#   release        :<version>, :<major>.<minor>, and :latest
#
# GitHub runners have no GPU, so the smoke test runs whisper.cpp's Vulkan
# backend on Mesa's software rasterizer (lavapipe). ggml skips CPU-type Vulkan
# devices unless GGML_VK_VISIBLE_DEVICES names one, which is set for the test
# only. That proves the Vulkan build works end to end; it says nothing about
# speed.
name: Docker (Vulkan)

on:
  workflow_dispatch:
  push:
    branches:
      - main
  release:
    types: [published]
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/frauhottelmann/wyoming-vulkan-whisper
  # Outside the checkout on purpose: the push step sends the checkout to
  # BuildKit as the build context, and it fails on any file there it cannot
  # read (.dockerignore does not stop it from walking a directory).
  DATA_DIR: ${{ github.workspace }}/../whisper-data

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=ref,event=pr

      # Built once into the local image store for the smoke test; the push
      # below reuses the same layers from the cache.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.vulkan
          platforms: linux/amd64
          load: true
          tags: wyoming-vulkan-whisper:test
          cache-from: type=gha,scope=vulkan
          cache-to: type=gha,mode=max,scope=vulkan

      - name: Cache models
        uses: actions/cache@v6
        with:
          path: ${{ env.DATA_DIR }}
          key: vulkan-models-base

      - name: Start container
        run: |
          mkdir -p "$DATA_DIR"
          # As the runner's user, so the files written to /data (the model,
          # Mesa's shader cache) stay readable for the cache step.
          #
          # GGML_VK_DISABLE_COOPMAT: lavapipe in Mesa 26 (Ubuntu 26.04)
          # advertises VK_KHR_cooperative_matrix, and with ggml's coopmat
          # shaders it decodes this clip as "(Music)". With them off it
          # transcribes correctly. The flag is set for this test only; the
          # image does not set it, so GPUs with cooperative matrix support
          # (RDNA3 and newer under RADV) still use those shaders.
          docker run -d --name whisper -p 10300:10300 \
            --user "$(id -u):$(id -g)" \
            -v "$DATA_DIR:/data" \
            -e GGML_VK_VISIBLE_DEVICES=0 \
            -e GGML_VK_DISABLE_COOPMAT=1 \
            wyoming-vulkan-whisper:test \
            --model base --language en --vad-clip

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Smoke test
        run: |
          pip install 'wyoming>=1.10.2,<2'
          python3 script/smoke_test --uri tcp://127.0.0.1:10300 \
            --wav tests/turn_on_the_living_room_lamp.wav \
            --expect "turn on the living room lamp"

      # whisper.cpp falls back to the CPU silently when it finds no Vulkan
      # device, which would make the smoke test pass for the wrong reason.
      - name: Check that Vulkan was used
        run: |
          docker logs whisper 2>&1 | grep -E "ggml_vulkan|whisper_backend_init_gpu"
          docker logs whisper 2>&1 | grep -q "using Vulkan0 backend"

      - name: Check health
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' whisper)"
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 5
          done
          exit 1

      - name: Container log
        if: always()
        run: docker logs whisper 2>&1 | grep -v "unknown token" | tail -100 || true

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runs on pull requests too, without pushing, so that a PR exercises the
      # same step (and build context) that publishes from main.
      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.vulkan
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vulkan
